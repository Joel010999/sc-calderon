{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 3rem auto; padding: 0 1.5rem;">
  <div class="card" style="background: #ffffff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 2.5rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center;">
    <div style="width: 54px; height: 54px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>

    <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.65rem; color: var(--brand-dark, #0d1b1e); margin-bottom: 0.75rem;">
      ¡Contraseña actualizada!
    </h1>

    <p style="color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem;">
      Tu contraseña ha sido restablecida correctamente. Ya podés iniciar sesión con tus nuevas credenciales.
    </p>

    <a href="{% url 'login_cliente' %}" class="button button--primary" style="display: inline-block; padding: 0.85rem 2rem; text-decoration: none; font-weight: 600;">
      Iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
