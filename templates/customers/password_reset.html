{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 3rem auto; padding: 0 1.5rem;">
  <div class="card" style="background: #ffffff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 2.5rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.65rem; color: var(--brand-dark, #0d1b1e); margin-bottom: 0.5rem;">
        Recuperar contraseña
      </h1>
      <p style="color: #64748b; font-size: 0.95rem;">
        Ingresá tu correo electrónico y te enviaremos un enlace seguro para restablecer tu contraseña.
      </p>
    </div>

    <form method="POST" action="{% url 'password_reset' %}">
      {% csrf_token %}
      <div style="margin-bottom: 1.5rem;">
        <label for="email" style="display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.35rem;">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tu@correo.com" style="width: 100%; padding: 0.7rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;">
      </div>

      <button type="submit" class="button button--primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600;">
        Enviar enlace de recuperación
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid #f1f5f9;">
      <a href="{% url 'login_cliente' %}" style="color: var(--color-primary, #2b593f); font-weight: 600; text-decoration: none; font-size: 0.92rem;">
        ← Volver al inicio de sesión
      </a>
    </div>
  </div>
</div>
{% endblock %}
