{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 480px; margin: 3rem auto; padding: 0 1.5rem;">
  <div class="card" style="background: #ffffff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 2.5rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center;">
    <div style="width: 54px; height: 54px; background: #e0f2fe; color: #0284c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>

    <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.65rem; color: var(--brand-dark, #0d1b1e); margin-bottom: 0.75rem;">
      Revisá tu correo
    </h1>

    <p style="color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem;">
      Si la dirección ingresada corresponde a una cuenta registrada, recibirás un correo con un enlace seguro para restablecer tu contraseña.
    </p>

    <a href="{% url 'login_cliente' %}" class="button button--secondary" style="display: inline-block; padding: 0.75rem 1.5rem; text-decoration: none;">
      Volver al inicio de sesión
    </a>
  </div>
</div>
{% endblock %}
