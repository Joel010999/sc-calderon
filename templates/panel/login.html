{% extends 'panel/base.html' %}

{% block content %}
<div class="login-wrapper">
    <div class="login-header">
        <h2>Ingreso al Panel</h2>
        <p>Solo personal autorizado de SC Viajes</p>
    </div>

    <div class="login-box">
        <form action="{% url 'panel:login' %}" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username" class="form-label">Usuario</label>
                <input id="id_username" name="username" type="text" required class="form-input">
            </div>

            <div class="form-group">
                <label for="id_password" class="form-label">Contraseña</label>
                <input id="id_password" name="password" type="password" required class="form-input">
            </div>

            <div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
