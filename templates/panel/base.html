{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC Viajes - Panel</title>
    <link rel="stylesheet" href="{% static 'panel/css/panel.css' %}">
    <link rel="stylesheet" href="{% static 'panel/css/operations.css' %}">
</head>
<body>
    {% if request.user.is_authenticated %}
    <nav class="panel-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <span>SC Viajes</span>
            </div>
            <div class="nav-user">
                <span class="nav-username">{{ request.user.username }}</span>
                <form action="{% url 'panel:logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main>
        {% if messages %}
            <div class="alert-container">
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}" role="{% if message.tags == 'success' %}status{% else %}alert{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
