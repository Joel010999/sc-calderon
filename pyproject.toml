[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import some symbols to aggregate/discover suites.
"**/test_*.py" = ["F401"]
"**/tests.py" = ["F401"]
"core/tests.py" = ["F401"]
# These modules predate the quality gate and use compact, reviewed forms. Reformatting
# them would create a broad, behavior-neutral diff outside this hardening change.
"panel/inbox_services.py" = ["E701", "E702", "E731"]
"panel/staff_services.py" = ["E701", "E702"]
"panel/staff_views.py" = ["E701", "E702"]
# setup_groups must call django.setup() before importing the app model.
"setup_groups.py" = ["E402"]
