name: Sales PostgreSQL tests

on:
  push:
    branches:
      - feature/sales-foundation-20260917
      - feature/manual-reservations-panel-20260918
      - feature/manual-payments-20260918
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scviajes_ci
          POSTGRES_USER: scviajes_ci
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scviajes_ci -d scviajes_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      DATABASE_URL: postgresql://scviajes_ci:test-only-password@127.0.0.1:5432/scviajes_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: PostgreSQL concurrency tests
        run: python manage.py test sales.tests.SalesPostgresConcurrencyTests --verbosity 2
      - name: Payments PostgreSQL constraint and concurrency tests
        run: python manage.py test payments.tests.PaymentsPostgresConcurrencyTests --verbosity 2
      - name: Sales tests on PostgreSQL
        run: python manage.py test sales
      - name: Complete suite on PostgreSQL
        run: python manage.py test
