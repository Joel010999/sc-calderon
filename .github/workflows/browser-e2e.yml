name: Browser acceptance E2E

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scviajes_e2e
          POSTGRES_USER: scviajes_e2e
          POSTGRES_PASSWORD: e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scviajes_e2e -d scviajes_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: 'True'
      TESTING: 'True'
      SCVIAJES_ENVIRONMENT: test
      DEMO_SCENARIO_ENABLED: 'True'
      SECRET_KEY: e2e-only-secret-not-for-production
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql://scviajes_e2e:e2e-only-password@127.0.0.1:5432/scviajes_e2e
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEMO_ADMIN_PASSWORD: e2e-only-admin-password-20261007
      DEMO_SELLER_PASSWORD: e2e-only-seller-password-20261007
      DEMO_CUSTOMER_PASSWORD: e2e-only-customer-password-20261007
      DEMO_CASH_SELLER_USERNAME: demo-20261005-cash-vendedor
      DEMO_CASH_SELLER_PASSWORD: e2e-only-cash-seller-password-20261010
      E2E_SECRET_FILE: /tmp/scviajes-browser-e2e-secrets.json
      MEDIA_ROOT: ${{ github.workspace }}/.e2e-media
      PROTECTED_MEDIA_ROOT: ${{ github.workspace }}/.e2e-protected-media
      TICKETS_STORAGE_ROOT: ${{ github.workspace }}/.e2e-tickets
      PRIVATE_STORAGE_BACKEND: filesystem
      ABUSE_CHECKOUT_LIMIT: '10'
      BANK_TRANSFER_ACCOUNT_HOLDER: SC Viajes E2E
      BANK_TRANSFER_ALIAS: scviajes.test
      BANK_TRANSFER_CVU: "1234567890123456789012"
      BANK_TRANSFER_CUIT: 20-12345678-6
      BANK_TRANSFER_ENTITY: Mercado Pago (test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Instalar dependencias Python y Playwright
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Preparar base temporal PostgreSQL y escenario demo
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor; print('Motor E2E verificado:', connection.vendor, '-', connection.settings_dict['NAME'])"
          python manage.py seed_demo_scenario
          python e2e/prepare_browser_scenario.py
          python manage.py collectstatic --noinput
      - name: Ejecutar aceptación en navegador
        run: npm run test:e2e -- e2e/acceptance.spec.js
      - name: Restablecer escenario para accesibilidad
        run: |
          python manage.py seed_demo_scenario --reset
          python manage.py seed_demo_scenario
      - name: Verificar suite de accesibilidad con axe
        run: npm run test:e2e -- e2e/accessibility.spec.js
      - name: Auditar Apple ficticio sin navegar al proveedor
        env:
          APPLE_OIDC_SIMULATION_ENABLED: 'True'
        run: npm run test:e2e -- e2e/accessibility.spec.js -g "Apple habilitado ficticiamente"
      - name: Instalar dependencias de la prueba visual con Chrome (sólo test)
        run: python -m pip install requests==2.32.4 aiohttp==3.12.15
      - name: Ejecutar prueba visual de gráficos con Chrome headless
        run: python manage.py test panel.test_sales_charts_and_commissions.SalesChartsBrowserValidationTests --verbosity 2
      - name: Publicar artefactos sólo si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: |
            test-results/
            e2e-report/
