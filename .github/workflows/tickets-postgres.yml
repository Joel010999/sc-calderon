name: Tickets PostgreSQL CI

on:
  push:
    branches:
      - feature/ticket-pdf-foundation-20260919
  pull_request:
    branches:
      - feature/ticket-pdf-foundation-20260919

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scviajes_ci
          POSTGRES_USER: scviajes_ci
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scviajes_ci -d scviajes_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      DATABASE_URL: postgresql://scviajes_ci:test-only-password@127.0.0.1:5432/scviajes_ci
      PYTHONDONTWRITEBYTECODE: "1"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tickets PostgreSQL concurrency tests
        run: python manage.py test tickets.tests.TicketsPostgresConcurrencyTests --verbosity 2
      - name: Tickets suite on PostgreSQL
        run: python manage.py test tickets --verbosity 2
      - name: Complete test suite on PostgreSQL
        run: python manage.py test --verbosity 2
